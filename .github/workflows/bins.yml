name: Binaries Publisher

run-name: Binaries Publisher | ${{ github.event_name }} by ${{ github.actor }} on '${{ github.ref_name }}'

on:
  workflow_dispatch:
  push:
    branches:
      - test-ci  # <-- Automatically runs on push to test-ci!
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  publish:
    name: Publishing for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            os-name: macos
            target: x86_64-apple-darwin
            architecture: x86_64
            binary-postfix: ""
            binary-name: installer
          - os: macos-latest
            os-name: macos
            target: aarch64-apple-darwin
            architecture: arm64
            binary-postfix: ""
            binary-name: installer
          - os: ubuntu-22.04
            os-name: linux
            target: x86_64-unknown-linux-gnu
            architecture: x86_64
            binary-postfix: ""
            binary-name: installer
          - os: ubuntu-24.04-arm
            os-name: linux
            target: aarch64-unknown-linux-gnu
            architecture: arm64
            binary-postfix: ""
            binary-name: installer
          - os: windows-latest
            os-name: windows
            target: x86_64-pc-windows-msvc
            architecture: x86_64
            binary-postfix: ".exe"
            binary-name: installer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set OpenSSL path on macOS
        if: runner.os == 'macOS'
        run: |
          OPENSSL_PREFIX="$(brew --prefix openssl@3)"
          echo "OPENSSL_DIR=$OPENSSL_PREFIX" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$OPENSSL_PREFIX/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libglib2.0-dev libgtk-3-dev libssl-dev \
            libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev libxdo-dev zip

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Cargo build
        shell: bash
        run: cargo build --release --target ${{ matrix.target }}

      - name: Packaging final binary
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release

          BINARY_NAME="${{ matrix.binary-name }}${{ matrix.binary-postfix }}"
          REF_SLUG="${GITHUB_REF_NAME:-manual}"
          RELEASE_NAME="${{ matrix.binary-name }}-${REF_SLUG}-${{ matrix.os-name }}-${{ matrix.architecture }}"
          ARCHIVE_NAME="$RELEASE_NAME.zip"

          # Copy docs if present
          cp ../../../README.md . 2>/dev/null || true
          cp ../../../LICENSE . 2>/dev/null || true

          FILES_TO_PACK=("$BINARY_NAME")
          [ -f "README.md" ] && FILES_TO_PACK+=("README.md")
          [ -f "LICENSE" ] && FILES_TO_PACK+=("LICENSE")

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a "$ARCHIVE_NAME" "${FILES_TO_PACK[@]}"
          else
            zip -r "$ARCHIVE_NAME" "${FILES_TO_PACK[@]}"
          fi

          # Generate SHA256 checksum
          if command -v sha256sum &> /dev/null; then
            sha256sum "$ARCHIVE_NAME" > "$ARCHIVE_NAME.sha256"
          elif command -v shasum &> /dev/null; then
            shasum -a 256 "$ARCHIVE_NAME" > "$ARCHIVE_NAME.sha256"
          elif [[ "${{ runner.os }}" == "Windows" ]]; then
            certutil -hashfile "$ARCHIVE_NAME" sha256 | grep -E "[A-Fa-f0-9]{64}" | tr -d '\r ' > "$ARCHIVE_NAME.sha256"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary-name }}-${{ matrix.os-name }}-${{ matrix.architecture }}
          path: |
            target/${{ matrix.target }}/release/${{ matrix.binary-name }}-*.zip
            target/${{ matrix.target }}/release/${{ matrix.binary-name }}-*.sha256

      - name: Releasing assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          files: |
            target/${{ matrix.target }}/release/${{ matrix.binary-name }}-*.zip
            target/${{ matrix.target }}/release/${{ matrix.binary-name }}-*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
